name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fussball
          POSTGRES_PASSWORD: fussball
          POSTGRES_DB: fussball_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fussball -d fussball_hub"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgres://fussball:fussball@localhost:5432/fussball_hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Schema ist aktuell (keine fehlende Migration)
        run: |
          npx drizzle-kit generate --name ci_check
          git diff --exit-code -- drizzle || (echo "Schema geändert, aber keine Migration erzeugt: npm run db:generate" && exit 1)
          test -z "$(git status --porcelain -- drizzle)" || (git status -- drizzle && echo "Schema geändert, aber keine Migration erzeugt: npm run db:generate" && exit 1)
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm test
      - run: npm run build
      - name: E2E-Smoke-Tests mit Testdaten
        run: |
          npm run ingest -- testdaten
          npx playwright install --with-deps chromium
          npm run test:e2e
