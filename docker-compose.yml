services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fussball
      POSTGRES_PASSWORD: fussball
      POSTGRES_DB: fussball_hub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fussball -d fussball_hub"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
